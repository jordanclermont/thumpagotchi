<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Thumpagotchi — Pixel</title>

<!--
  ============================================================================
  THUMPAGOTCHI  ·  PIXEL EDITION
  ----------------------------------------------------------------------------
  A cosy Holland Lop digital pet, rendered as authentic pixel art. The whole
  scene is drawn to a small low-resolution buffer canvas (flat retro palette,
  hand-placed pixels, dithered shading, 1px outlines) and then blown up with
  crisp nearest-neighbour scaling — the classic Game-Boy / Tamagotchi look.

  Fully self-contained: one file, no libraries, no build step, no server.
  Keeps every system from the original — Happy/Hunger/Water/Hygiene decay, the
  5-paw Thump Meter, the Cold Shoulder, tricks & binkies, the sun arcing down
  over the day, and the 3 A.M. midnight-zoomies cutscene.
  ============================================================================
-->

<style>
  :root{
    --cream:#f4ecd8; --ink:#2a1d15;
    --panel:rgba(24,18,14,.6); --panel-brd:#5a4636;
    --good:#7bc46c; --warn:#e6bd3c; --bad:#e0603a; --accent:#e8a13a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; height:100%; overflow:hidden; background:#120c09;
    /* a chunky, monospaced retro face keeps the UI on-theme without web fonts */
    font-family:'Courier New',ui-monospace,Menlo,Consolas,monospace;
    color:var(--cream); letter-spacing:.5px;
  }
  #game{position:relative; width:100vw; height:100dvh; height:100vh; user-select:none; touch-action:none;}
  /* image-rendering:pixelated → the up-scaled buffer stays crisp, never blurry */
  canvas#c{display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges;}

  /* ---- Status HUD (top) ---- */
  #hud{
    position:absolute; top:0; left:0; right:0; padding:8px 10px 12px;
    display:flex; flex-wrap:wrap; gap:5px 12px; align-items:center;
    background:linear-gradient(180deg, rgba(18,12,9,.82), rgba(18,12,9,0));
    pointer-events:none; z-index:4; font-size:11px; text-transform:uppercase;
  }
  .brand{width:100%; display:flex; align-items:center; gap:10px; margin-bottom:2px;}
  .brand h1{font-size:14px; margin:0; letter-spacing:2px; color:#ffd98a; text-shadow:2px 2px 0 #6e3d16;}
  .brand .day{font-size:10px; opacity:.75;}
  .brand .clock{font-size:14px; margin-left:auto;}
  .stat{display:flex; align-items:center; gap:6px; min-width:132px; flex:1 1 132px;}
  .stat .lbl{font-size:10px; opacity:.85; width:52px; text-align:right;}
  .track{
    position:relative; flex:1; height:12px; background:#241a13;
    border:2px solid #5a4636; box-shadow:2px 2px 0 rgba(0,0,0,.5); overflow:hidden;
  }
  .fill{position:absolute; inset:0; width:50%; transition:width .3s steps(6), background .3s;}
  #thumpMeter{display:flex; align-items:center; gap:6px; min-width:150px;}
  #thumpMeter .lbl{font-size:10px; opacity:.85;}
  #paws{display:flex; gap:3px;}
  .paw{width:18px; height:18px; opacity:.24; transition:opacity .15s, transform .15s, filter .15s;}
  .paw.on{opacity:1; filter:drop-shadow(0 0 3px #e0603a); transform:scale(1.12);}

  /* ---- Control dock (bottom) ---- */
  #controls{
    position:absolute; left:0; right:0; bottom:0; padding:10px 8px 14px;
    display:flex; gap:7px; justify-content:center; flex-wrap:wrap;
    background:linear-gradient(0deg, rgba(18,12,9,.86), rgba(18,12,9,0)); z-index:4;
  }
  button.act{
    appearance:none; cursor:pointer; color:#2a1810; font-size:12px; font-weight:700;
    padding:8px 11px; text-transform:uppercase; letter-spacing:.5px;
    background:#e6c078; border:2px solid #2a1810;
    box-shadow:3px 3px 0 #7a531f; transition:transform .05s, box-shadow .05s;
    display:flex; align-items:center; gap:5px; font-family:inherit;
  }
  button.act:active{transform:translate(3px,3px); box-shadow:0 0 0 #7a531f;}
  button.act .emo{font-size:15px;}
  button.act.armed{background:#ffcf7a; box-shadow:3px 3px 0 #7a531f, 0 0 0 2px #fff inset;}

  /* ---- Toast + big centre caption ---- */
  #toast{
    position:absolute; top:64px; left:50%; transform:translateX(-50%);
    background:var(--panel); border:2px solid var(--panel-brd);
    padding:7px 14px; font-size:12px; opacity:0; transition:opacity .2s;
    pointer-events:none; max-width:84vw; text-align:center; z-index:6;
    box-shadow:3px 3px 0 rgba(0,0,0,.5);
  }
  #toast.show{opacity:1;}
  #bigcap{
    position:absolute; top:34%; left:50%; transform:translate(-50%,-50%) scale(.6);
    font-size:34px; font-weight:900; letter-spacing:3px; color:#ffcf5b;
    text-shadow:3px 3px 0 #3a1e12, -1px -1px 0 #3a1e12; z-index:6;
    opacity:0; pointer-events:none; text-align:center; text-transform:uppercase;
  }
  #bigcap.pop{animation:pop .9s ease-out;}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.5);}}
  #bigcap.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
  #bigcap small{display:block; font-size:12px; letter-spacing:1px; color:#cfd3ff; margin-top:6px; text-shadow:2px 2px 0 #2a1e40;}
  #hint{position:absolute; bottom:66px; left:50%; transform:translateX(-50%);
    font-size:10px; opacity:.5; pointer-events:none; text-align:center; width:92%; z-index:4; text-transform:uppercase;}

  /* ---- Adoption screen ---- */
  #start{position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:#1a1330; padding:16px;}
  #start.hidden{display:none;}
  #start .card{width:min(420px,94vw); background:#241a2e; border:3px solid #5a4636;
    box-shadow:6px 6px 0 rgba(0,0,0,.5); padding:22px; text-align:center;}
  #start .logo{font-size:44px; line-height:1; image-rendering:pixelated;}
  #start h1{margin:6px 0 0; font-size:22px; letter-spacing:3px; color:#ffd98a; text-shadow:2px 2px 0 #6e3d16;}
  #start .tag{margin:3px 0 16px; font-size:11px; opacity:.7; text-transform:uppercase;}
  #start label{display:block; text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:1px; opacity:.7; margin:12px 2px 6px;}
  #nameInput{width:100%; padding:10px 12px; border:2px solid #5a4636; background:#161022; color:#fff; font-size:14px; outline:none; font-family:inherit;}
  #nameInput:focus{border-color:var(--accent);}
  .seg{display:flex; gap:8px;}
  .seg button{flex:1; padding:10px; border:2px solid #5a4636; background:#161022; color:var(--cream); font-size:14px; cursor:pointer; font-family:inherit;}
  .seg button.on{background:#e6c078; color:#2a1810; font-weight:700; border-color:#2a1810;}
  .swatches{display:flex; flex-wrap:wrap; gap:9px; justify-content:center;}
  .swatch{width:44px; height:44px; cursor:pointer; border:3px solid transparent; image-rendering:pixelated; box-shadow:2px 2px 0 rgba(0,0,0,.5);}
  .swatch.on{border-color:#fff;}
  .coatName{font-size:11px; opacity:.8; margin-top:8px; height:15px; text-transform:uppercase;}
  #startBtn{margin-top:18px; width:100%; padding:13px; cursor:pointer; font-size:15px; font-weight:800;
    color:#2a1810; background:#ffcf7a; border:3px solid #2a1810; box-shadow:4px 4px 0 #7a531f;
    text-transform:uppercase; letter-spacing:1px; font-family:inherit;}
  #startBtn:active{transform:translate(3px,3px); box-shadow:0 0 0 #7a531f;}
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="brand"><h1>🐰 <span id="petName">THUMPAGOTCHI</span></h1><span class="day" id="dayLbl">Day 1</span><span class="clock" id="clockLbl">🌅</span></div>
    <div class="stat"><span class="lbl">Happy</span><div class="track"><div class="fill" id="fHappy"></div></div></div>
    <div class="stat"><span class="lbl">Hunger</span><div class="track"><div class="fill" id="fHunger"></div></div></div>
    <div class="stat"><span class="lbl">Water</span><div class="track"><div class="fill" id="fWater"></div></div></div>
    <div class="stat"><span class="lbl">Hygiene</span><div class="track"><div class="fill" id="fHygiene"></div></div></div>
    <div id="thumpMeter"><span class="lbl">Thumps</span><span id="paws"></span></div>
  </div>

  <div id="toast"></div>
  <div id="bigcap"></div>
  <div id="hint">Feed, water &amp; love your bun — or the feet do the talking.</div>

  <div id="controls">
    <button class="act" id="bHay"><span class="emo">🌾</span>Hay</button>
    <button class="act" id="bPellets"><span class="emo">🥣</span>Pellets</button>
    <button class="act" id="bWater"><span class="emo">💧</span>Water</button>
    <button class="act" id="bBanana"><span class="emo">🍌</span>Banana</button>
    <button class="act" id="bPet"><span class="emo">✋</span>Pet</button>
    <button class="act" id="bTrick"><span class="emo">🌟</span>Trick</button>
    <button class="act" id="bClean"><span class="emo">🧹</span>Clean</button>
  </div>

  <!-- ---------- Adoption screen ---------- -->
  <div id="start">
    <div class="card">
      <div class="logo">🐰</div>
      <h1>THUMPAGOTCHI</h1>
      <p class="tag">Adopt your Holland Lop</p>
      <label>Name</label>
      <input id="nameInput" maxlength="12" placeholder="e.g. Mowgli" autocomplete="off">
      <label>Sex</label>
      <div class="seg" id="sexSeg">
        <button data-sex="doe" class="on">♀ Doe</button>
        <button data-sex="buck">♂ Buck</button>
      </div>
      <label>Coat colour</label>
      <div class="swatches" id="swatches"></div>
      <div class="coatName" id="coatName">Sable Point (Grey)</div>
      <button id="startBtn">Bring them home →</button>
    </div>
  </div>
</div>

<script>
"use strict";
(() => {
/* ===========================================================================
 *  0.  DISPLAY + LOW-RES PIXEL BUFFER
 *      Everything is drawn into a small buffer (design height = 200px) and
 *      then scaled up with smoothing OFF for crisp, chunky pixels.
 * ======================================================================== */
const disp = document.getElementById('c');
const dctx = disp.getContext('2d');
const buf  = document.createElement('canvas');
const g    = buf.getContext('2d');

const DESIGN_SHORT = 200;             // the shorter screen edge = 200 design pixels
let PW = 0, PH = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const cw = disp.clientWidth, ch = disp.clientHeight;
  // Normalise by the shorter edge so pixels stay square (no distortion) and the
  // sprite keeps a consistent size whether the screen is portrait or landscape.
  const s = Math.max(1, Math.min(cw, ch)) / DESIGN_SHORT;
  PW = Math.max(64, Math.round(cw / s));
  PH = Math.max(64, Math.round(ch / s));
  buf.width = PW; buf.height = PH;
  disp.width  = Math.floor(cw * DPR);
  disp.height = Math.floor(ch * DPR);
  dctx.imageSmoothingEnabled = false;
  layout();
}
window.addEventListener('resize', resize);

/* ---------------- Utilities ---------------- */
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const damp  = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const rand  = (a, b) => a + Math.random() * (b - a);
const pick  = arr => arr[Math.floor(Math.random() * arr.length)];
const now   = () => performance.now() / 1000;
const cap   = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------------- Pixel drawing primitives (buffer space) ------------- */
function rect(x, y, w, h, c){ g.fillStyle = c; g.fillRect(x|0, y|0, Math.max(1, w|0), Math.max(1, h|0)); }
function px(x, y, c){ g.fillStyle = c; g.fillRect(x|0, y|0, 1, 1); }
// crisp filled ellipse (scan-line, hard edges — no anti-aliasing)
function ell(cx, cy, rx, ry, c){
  cx |= 0; cy |= 0; g.fillStyle = c;
  for (let y = -ry; y <= ry; y++){
    const k = 1 - (y*y)/(ry*ry); if (k < 0) continue;
    const hw = (Math.sqrt(k) * rx) | 0;
    g.fillRect(cx - hw, cy + y, hw*2 + 1, 1);
  }
}
// filled ellipse with a 1px darker outline
function ellO(cx, cy, rx, ry, fill, outline){ ell(cx, cy, rx+1, ry+1, outline); ell(cx, cy, rx, ry, fill); }
// checkerboard-dithered ellipse (soft pixel shading / colour blends)
function ellDither(cx, cy, rx, ry, c, opts){
  cx |= 0; cy |= 0; g.fillStyle = c;
  const yMin = opts && opts.yMin !== undefined ? opts.yMin : -1e9;
  const phase = opts && opts.phase || 0;
  for (let y = -ry; y <= ry; y++){
    const yy = cy + y; if (yy < yMin) continue;
    const k = 1 - (y*y)/(ry*ry); if (k < 0) continue;
    const hw = (Math.sqrt(k) * rx) | 0;
    for (let x = -hw; x <= hw; x++){ if (((cx + x + yy) & 1) === phase) g.fillRect(cx + x, yy, 1, 1); }
  }
}
function ringOutline(cx, cy, rx, ry, c){    // 1px elliptical ring (thump ripple)
  cx |= 0; cy |= 0; g.fillStyle = c;
  for (let a = 0; a < 6.283; a += 0.12){
    g.fillRect((cx + Math.cos(a)*rx) | 0, (cy + Math.sin(a)*ry) | 0, 1, 1);
  }
}

/* ===========================================================================
 *  1.  COAT PALETTES (flat pixel tones: outline·body·shade·hi + face mask)
 * ======================================================================== */
const COATS = {
  sableGrey:  {name:'Sable Point (Grey)',  body:'#e7ddc4', hi:'#f7efdb', shade:'#c9bd9f', mask:'#5a4d40', point:'#332a22', sable:true },
  sableSepia: {name:'Sable Point (Sepia)', body:'#ece0c8', hi:'#fbf3df', shade:'#d2be98', mask:'#5c3d28', point:'#301f14', sable:true },
  chestnut:   {name:'Chestnut',            body:'#c0854a', hi:'#dda766', shade:'#93602f', mask:'#5a3a20', point:'#341f10', sable:false},
  black:      {name:'Black',               body:'#544a41', hi:'#726459', shade:'#382f28', mask:'#241d17', point:'#0e0b09', sable:false},
  blue:       {name:'Blue (Grey)',         body:'#a3a4a9', hi:'#c9cad0', shade:'#7c7d83', mask:'#54555a', point:'#343539', sable:false},
  fawn:       {name:'Fawn / Orange',       body:'#e7b165', hi:'#f9d996', shade:'#cd9046', mask:'#b0702f', point:'#7c4a1c', sable:false},
};
let coat = COATS.sableGrey;

/* ===========================================================================
 *  2.  WORLD LAYOUT  (design-pixel coordinates)
 * ======================================================================== */
const world = { floorY:0, rug:{}, litter:{}, food:{}, water:{}, bed:{}, win:{} };
function layout(){
  world.floorY = Math.round(PH * 0.62);
  world.rug   = { x: PW>>1, y: Math.round(PH*0.80), rx: Math.round(PW*0.40), ry: Math.round(PH*0.075) };
  world.litter= { x: Math.round(PW*0.16), y: Math.round(PH*0.72), w: 40, h: 20 };
  world.food  = { x: Math.round(PW*0.32), y: Math.round(PH*0.90), r: 9 };
  world.water = { x: Math.round(PW*0.44), y: Math.round(PH*0.91), r: 8 };
  world.bed   = { x: Math.round(PW*0.66), y: Math.round(PH*0.88), r: 15 };
  world.win   = { x: (PW>>1) - 22, y: Math.round(PH*0.07), w: 44, h: 46 };
  rab.baseY = world.rug.y - 2;
  rab.x = clamp(rab.x || world.rug.x, world.rug.x - world.rug.rx*0.55, world.rug.x + world.rug.rx*0.55);
}

/* ===========================================================================
 *  3.  GAME STATE (ported from the original; behaviour preserved)
 * ======================================================================== */
const stats = { happy:80, hunger:30, water:85, hygiene:90 };
const rab = {
  name:'Mowgli', sex:'doe',
  x:0, baseY:0, hopOff:0, binkyHop:0,
  thumps:0, cold:false, bananasToday:0, day:1,
  state:'loaf', loaf:0,
  breath:0, noseTwitch:0, blink:0, nextBlink:2.5,
  legStomp:0, lookX:0, lookY:0,
  tummyUntil:0, groomUntil:0,
  hopping:false, hopFromX:0, hopToX:0, hopT0:0, hopDur:0.6,
  binkyT:0, binkyDur:0.85, trick:null,
};
const PRON = { doe:{s:'she',o:'her',p:'her'}, buck:{s:'he',o:'him',p:'his'} };
const P = () => PRON[rab.sex] || PRON.doe;

let started = false, wasAbove3 = false;
let pettingMode = false;
let pointer = { x:-999, y:-999, down:false, moved:0 };
let lastPetGain = 0, lastFeetPet = 0;

let timeOfDay = 0.05; const DAY_LEN = 100;      // seconds of daylight
let cutscene = null;                             // {t,dur} night zoomies
const particles = [], bananas = [], thumpRipples = [];
let hayFresh = 0, thumpFx = 0;

/* ===========================================================================
 *  4.  RABBIT GEOMETRY
 * ======================================================================== */
function parts(){
  const cx = rab.x | 0;
  const groundY = (rab.baseY + rab.hopOff + rab.binkyHop) | 0;
  const loaf = rab.loaf, alert = rab.state === 'alert';
  const bodyRx = Math.round(30 * (1 + 0.10*loaf));
  const bodyRy = Math.round(21 * (1 - 0.22*loaf));
  const bodyCy = groundY - Math.round(bodyRy*0.85);
  const headR  = 16;
  const headCx = cx + (alert ? Math.round(rab.lookX*2) : 0);
  const headCy = bodyCy - Math.round(bodyRy*0.5) - 4 + Math.round(loaf*7) + (alert ? -2 : 0);
  return {
    cx, groundY, loaf,
    body:{ x:cx, y:bodyCy, rx:bodyRx, ry:bodyRy },
    head:{ x:headCx, y:headCy, r:headR },
    feet:{ x:cx, y:groundY - 3, r:16 },
    tail:{ x:cx - bodyRx + 4, y:bodyCy + Math.round(bodyRy*0.4), r:8 },
  };
}

/* ===========================================================================
 *  5.  BACKGROUND — room, day/night sky, sun arc, props
 * ======================================================================== */
function skyLight(){ return Math.sin(clamp(timeOfDay,0,1) * Math.PI); }   // 1 noon → 0 dusk
function mix(a, b, t){                                                     // blend two #rrggbb
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  const r = Math.round(lerp((pa>>16)&255,(pb>>16)&255,t));
  const gg= Math.round(lerp((pa>>8)&255,(pb>>8)&255,t));
  const bl= Math.round(lerp(pa&255,pb&255,t));
  return `rgb(${r},${gg},${bl})`;
}

function drawRoom(){
  const edge = 1 - skyLight();
  // Wall — warms toward dusk
  const wallTop = mix('#efe0cb', '#caa27f', Math.min(1,edge));
  const wallBot = mix('#e6cfae', '#b98a67', Math.min(1,edge));
  for (let y = 0; y < world.floorY; y++) rect(0, y, PW, 1, y < world.floorY*0.5 ? wallTop : wallBot);

  // Window with a live day/night sky + arcing sun/moon
  const wd = world.win;
  const night = edge > 0.9;
  const skyTop = night ? '#12173a' : mix('#8fc7ea','#e79a52', Math.min(1,edge*1.05));
  const skyBot = night ? '#232a55' : mix('#cfe9f6','#f6cf9a', Math.min(1,edge*1.05));
  for (let y = 0; y < wd.h; y++) rect(wd.x, wd.y+y, wd.w, 1, y < wd.h*0.5 ? skyTop : skyBot);
  // sun (day) / moon (dusk) travels left→right and sinks as the day ends
  const sxP = clamp(timeOfDay,0,1);
  const sx = wd.x + 5 + (wd.w-10)*sxP;
  const sy = wd.y + wd.h - Math.sin(sxP*Math.PI)*(wd.h-12) - 6;
  if (!night){
    const sun = mix('#fff2a8','#ff9a52', Math.min(1,edge*1.1));
    ell(sx, sy, 5, 5, sun); ell(sx, sy, 3, 3, '#fffbe0');
  } else {
    ell(sx, sy, 5, 5, '#eef1ff'); ell(sx+2, sy-1, 4, 4, skyTop);   // crescent moon
  }
  // window frame + mullions
  rect(wd.x-2, wd.y-2, wd.w+4, 2, '#f3ede2'); rect(wd.x-2, wd.y+wd.h, wd.w+4, 2, '#f3ede2');
  rect(wd.x-2, wd.y-2, 2, wd.h+4, '#f3ede2'); rect(wd.x+wd.w, wd.y-2, 2, wd.h+4, '#f3ede2');
  rect(wd.x + (wd.w>>1), wd.y, 1, wd.h, '#e7ddce'); rect(wd.x, wd.y + (wd.h>>1), wd.w, 1, '#e7ddce');

  // Skirting board
  rect(0, world.floorY-3, PW, 3, mix('#d7c2a4','#b08f6c',Math.min(1,edge)));

  // Wood floor (planks) — darkens toward dusk
  const flTop = mix('#cba079','#8f6a44',Math.min(1,edge));
  const flBot = mix('#a97e54','#6f5031',Math.min(1,edge));
  for (let y = world.floorY; y < PH; y++) rect(0, y, PW, 1, mix(flTop, flBot, (y-world.floorY)/(PH-world.floorY)));
  g.fillStyle = 'rgba(70,45,20,.18)';
  for (let i = 1; i < 6; i++){ const y = world.floorY + Math.round((PH-world.floorY)*i/6); g.fillRect(0, y, PW, 1); }

  drawRug();
  drawBed(); drawLitter(); drawFoodBowl(); drawWaterBowl();
}

function drawRug(){
  const r = world.rug;
  ell(r.x, r.y, r.rx, r.ry, '#5f958c');
  ell(r.x, r.y, r.rx-3, r.ry-2, '#6fa89c');
  ringOutline(r.x, r.y, Math.round(r.rx*0.7), Math.round(r.ry*0.7), 'rgba(255,255,255,.35)');
  ringOutline(r.x, r.y, Math.round(r.rx*0.42), Math.round(r.ry*0.42), 'rgba(255,255,255,.22)');
}
function drawLitter(){
  const L = world.litter;
  rect(L.x-L.w/2, L.y-L.h/2, L.w, L.h, '#3f6fae');
  rect(L.x-L.w/2+3, L.y-L.h/2+3, L.w-6, L.h-6, '#e7dcc4');
  const bright = hayFresh > 0;
  for (let i = 0; i < 16; i++){
    const hx = L.x-L.w/2+5 + ((i*7)%(L.w-10));
    const hy = L.y-L.h/2+5 + ((i*5)%6);
    px(hx, hy, bright ? '#e4c649' : '#c7ab48'); px(hx, hy-1, bright ? '#f0d868' : '#b99e40');
  }
  const mess = Math.round((100 - stats.hygiene)/16);
  for (let i = 0; i < mess; i++) px(L.x-L.w/2+6+((i*9)%(L.w-10)), L.y+3+((i*5)%6), '#6e5030');
}
function drawFoodBowl(){
  const b = world.food;
  ell(b.x, b.y, b.r, b.r*0.55, '#7d5230'); ell(b.x, b.y-1, b.r-1, b.r*0.45, '#9a6a3e');
  for (let i = 0; i < 6; i++) px(b.x-3+((i*3)%7), b.y-2+((i*2)%3), '#5f3d22');
}
function drawWaterBowl(){
  const b = world.water;
  ell(b.x, b.y, b.r, b.r*0.55, '#6a707c'); ell(b.x, b.y-1, b.r-1, b.r*0.45, '#7b818c');
  const lvl = Math.max(0.3, stats.water/100);
  ell(b.x, b.y-1, Math.round((b.r-2)*lvl), Math.round(b.r*0.32*lvl), '#5aa8dc');
}
function drawBed(){
  const b = world.bed;
  ell(b.x, b.y, b.r, b.r*0.5, '#b5546a');
  ell(b.x, b.y, b.r-3, b.r*0.4, '#e79fae');
}

/* ===========================================================================
 *  6.  THE RABBIT — hand-drawn pixel sprite, pose-driven
 * ======================================================================== */
function drawRabbit(t){
  const p = parts();
  const OUT = coat.point, BODY = coat.body, SH = coat.shade, HI = coat.hi, MASK = coat.mask;

  // Contact shadow
  const air = rab.hopOff + rab.binkyHop;
  const shSc = clamp(1 + air/60, 0.5, 1);
  ell(p.cx, rab.baseY+3, Math.round(p.body.rx*0.9*shSc), Math.round(3*shSc), 'rgba(30,20,12,.28)');

  // Cold shoulder → draw the back and bail out
  if (rab.state === 'cold'){ drawRabbitBack(p); return; }

  const breath = Math.round(Math.sin(rab.breath) * (rab.loaf > 0.5 ? 0.6 : 1.2));
  const tummy = rab.state === 'tummy';
  const groom = t < rab.groomUntil;
  const flop = rab.trick && rab.trick.name === 'flop';

  // --- Tail (behind body, dark sable point) ---
  ellO(p.tail.x, p.tail.y, p.tail.r, p.tail.r-1, MASK, OUT);
  ell(p.tail.x-1, p.tail.y-1, 3, 3, coat.point);

  // --- Hind feet (hidden as the loaf tucks in) ---
  if (rab.loaf < 0.7){
    for (const side of [-1, 1]){
      const fx = p.body.x + side*Math.round(p.body.rx*0.6);
      const fy = p.groundY - 2 + (side === 1 ? Math.round(rab.legStomp*4) : 0);
      ellO(fx, fy, 8, 4, MASK, OUT);
      px(fx-3, fy+1, coat.point); px(fx, fy+1, coat.point); px(fx+3, fy+1, coat.point);
    }
  }

  // --- Body: cobby outlined ellipse with dithered belly shade + top highlight ---
  ellO(p.body.x, p.body.y+breath, p.body.rx, p.body.ry+breath, BODY, OUT);
  ellDither(p.body.x, p.body.y+breath+2, p.body.rx-2, p.body.ry-1, SH, {yMin:p.body.y+breath+2, phase:0});
  ellDither(p.body.x-Math.round(p.body.rx*0.3), p.body.y-Math.round(p.body.ry*0.4)+breath, Math.round(p.body.rx*0.5), Math.round(p.body.ry*0.4), HI, {phase:1});
  if (tummy){ ellDither(p.body.x, p.body.y+breath+3, p.body.rx-4, p.body.ry-3, '#8fc46c', {phase:1}); }

  // --- Front paws (little tucked feet), hidden when fully loafed ---
  if (rab.loaf < 0.7){
    const beg = rab.trick && rab.trick.name === 'beg';
    const lift = groom ? Math.round(Math.sin(t*14)*2) : (beg ? -8 : 0);
    for (const dx of [-6, 6]){ ellO(p.body.x+dx, p.body.y+p.body.ry-2-lift, 4, 5, BODY, OUT); }
  }

  drawHead(p, t, tummy, groom || flop);
}

function drawHead(p, t, tummy, closedEyes){
  const h = p.head, hx = h.x, hy = h.y, r = h.r;
  const OUT = coat.point, BODY = coat.body, SH = coat.shade, HI = coat.hi, MASK = coat.mask;
  const alert = rab.state === 'alert';
  const lookX = alert ? Math.round(rab.lookX*2) : 0, lookY = alert ? Math.round(rab.lookY*1) : 0;

  // Heavy lop EARS first, draping down the sides & framing the cheeks.
  drawEar(hx, hy, r, -1, t);
  drawEar(hx, hy, r,  1, t);

  // Head base (slightly wide), outlined, with a fluffy highlighted crown.
  ellO(hx, hy, r, r-1, BODY, OUT);
  ellDither(hx, hy-Math.round(r*0.55), Math.round(r*0.8), Math.round(r*0.4), HI, {phase:1}); // crown fluff
  ellDither(hx, hy+2, r-2, r-3, SH, {yMin:hy+3, phase:0});                                   // lower cheek shade

  // Espresso face MASK — dithered radial cluster centred on the muzzle (sable coats).
  const nmx = hx + lookX, nmy = hy + Math.round(r*0.32);
  if (coat.sable){
    ellDither(nmx, nmy-1, Math.round(r*0.72), Math.round(r*0.72), MASK, {phase:1});
    ellDither(nmx, nmy,   Math.round(r*0.5),  Math.round(r*0.5),  MASK, {phase:0});
    ell(nmx, nmy, 4, 4, MASK);
  } else {
    ellDither(nmx, nmy, Math.round(r*0.4), Math.round(r*0.4), MASK, {phase:1});
  }

  // Eyes (kept central so the ears never cover them)
  const eyeDX = Math.round(r*0.44), eyeY = hy + lookY;
  for (const dir of [-1, 1]){
    const ex = hx + dir*eyeDX + Math.round(lookX*0.5), ey = eyeY;
    if (tummy){ px(ex-1,ey-1,'#140f0b'); px(ex+1,ey+1,'#140f0b'); px(ex+1,ey-1,'#140f0b'); px(ex-1,ey+1,'#140f0b'); }
    else if (closedEyes || rab.blink > 0){ rect(ex-2, ey, 4, 1, '#140f0b'); }
    else { rect(ex-1, ey-2, 3, 4, '#160f0b'); px(ex-1, ey-2, '#fff'); }   // eye + catch-light
  }

  // Soft muzzle: a tiny dark nose (V) + mouth
  const tw = Math.round(Math.sin(rab.noseTwitch) * (alert?1:0.5));
  const nx = nmx, ny = hy + Math.round(r*0.42) + tw;
  rect(nx-1, ny, 3, 1, '#17100c'); px(nx, ny+1, '#17100c');
  px(nx, ny+2, 'rgba(30,20,14,.7)');
  px(nx-2, ny+3, 'rgba(30,20,14,.55)'); px(nx+2, ny+3, 'rgba(30,20,14,.55)');
  if (!tummy){ px(nx-1, ny+3, '#fdfcf5'); px(nx+1, ny+3, '#fdfcf5'); }     // teeth

  // Whiskers
  g.fillStyle = 'rgba(255,255,255,.55)';
  g.fillRect(nx-8, ny, 5, 1); g.fillRect(nx-9, ny-2, 5, 1);
  g.fillRect(nx+4, ny, 5, 1); g.fillRect(nx+5, ny-2, 5, 1);
}

/* Heavy teardrop lop ear: narrow at the crown, wide dark tip past the jaw. */
function drawEar(hx, hy, r, dir, t){
  const sway = Math.round(Math.sin(t*1.3 + dir) * 1) + (rab.state === 'alert' ? -1 : 0);
  const topX = hx + dir*Math.round(r*0.5);
  const ex = hx + dir*Math.round(r*0.72) + sway;   // ear centre x
  const eyTop = hy - Math.round(r*0.2);
  const erx = 5, ery = 13;
  const ecy = eyTop + ery;
  // outline + body
  ellO(ex, ecy, erx, ery, coat.body, coat.point);
  // shaded inner edge
  ellDither(ex, ecy, erx-1, ery-1, coat.shade, {phase:0});
  // dark chocolate tip (lower third)
  ellDither(ex, ecy+Math.round(ery*0.45), erx, Math.round(ery*0.55), coat.mask, {phase:1, yMin:ecy+Math.round(ery*0.2)});
  ell(ex, ecy+ery-3, erx-1, 3, coat.point);
  // connect to crown
  rect(Math.min(topX,ex)-1, eyTop-1, Math.abs(ex-topX)+2, 3, coat.body);
}

/* Back view for the Cold Shoulder */
function drawRabbitBack(p){
  const OUT = coat.point, BODY = coat.body, SH = coat.shade, HI = coat.hi;
  const breath = Math.round(Math.sin(rab.breath)*1.2);
  ellO(p.body.x, p.body.y+breath, p.body.rx, p.body.ry+2, BODY, OUT);
  ellDither(p.body.x, p.body.y-Math.round(p.body.ry*0.4)+breath, Math.round(p.body.rx*0.55), Math.round(p.body.ry*0.4), HI, {phase:1});
  rect(p.body.x, p.body.y-p.body.ry+2, 1, p.body.ry, 'rgba(90,60,40,.35)');  // spine
  // ear backs
  for (const dir of [-1,1]){ const ex = p.body.x + dir*Math.round(p.body.rx*0.45);
    ellO(ex, p.body.y-Math.round(p.body.ry*0.7), 5, 12, BODY, OUT);
    ell(ex, p.body.y-Math.round(p.body.ry*0.7)+6, 4, 5, coat.mask); }
  // big fluffy sable tail
  const tx = p.body.x, ty = p.body.y+Math.round(p.body.ry*0.5);
  ellO(tx, ty, 9, 8, coat.mask, OUT); ell(tx, ty, 5, 5, coat.point);
}

/* Tiny bunny used in the zoomies cutscene */
function drawMiniBunny(x, y, dir, alpha){
  g.globalAlpha = alpha;
  ell(x, y, 9, 6, coat.body);                          // body
  ell(x + dir*7, y-4, 5, 5, coat.body);                // head
  ell(x + dir*7 - dir*2, y-9, 2, 4, coat.mask);        // ear
  ell(x - dir*8, y-1, 3, 3, coat.mask);                // tail
  px(x + dir*9, y-4, '#140f0b');                       // eye
  g.globalAlpha = 1;
}

/* ===========================================================================
 *  7.  PARTICLES / FX (pixel blobs)
 * ======================================================================== */
function heart(x, y){ particles.push({type:'heart', x, y, vy:-16, vx:rand(-6,6), life:1.1, t:0}); }
function sparkle(x, y){ for (let i=0;i<5;i++) particles.push({type:'spark', x, y, vx:rand(-18,18), vy:rand(-18,4), life:.6, t:0}); }
function drop(x, y){ for (let i=0;i<6;i++) particles.push({type:'drop', x:x+rand(-4,4), y, vx:rand(-8,8), vy:rand(-4,8), life:.7, t:0}); }
function zzz(x, y){ particles.push({type:'z', x, y, vy:-9, vx:3, life:2, t:0}); }
function stars(x, y){ for (let i=0;i<5;i++) particles.push({type:'star', x, y, vx:rand(-20,20), vy:rand(-24,-4), life:.9, t:0}); }

function drawParticles(dt){
  for (const p of particles){
    p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 9*dt;
    const a = Math.max(0, 1 - p.t/p.life); g.globalAlpha = a;
    if (p.type === 'heart'){ rect(p.x-1,p.y,3,1,'#e0506a'); rect(p.x,p.y-1,1,3,'#e0506a'); px(p.x-1,p.y-1,'#e0506a'); px(p.x+1,p.y-1,'#e0506a'); }
    else if (p.type === 'spark'){ px(p.x,p.y,'#ffe9a8'); }
    else if (p.type === 'drop'){ px(p.x,p.y,'#8fd0f0'); }
    else if (p.type === 'star'){ px(p.x,p.y,'#fff'); px(p.x-1,p.y,'#ffe9a8'); px(p.x+1,p.y,'#ffe9a8'); px(p.x,p.y-1,'#ffe9a8'); px(p.x,p.y+1,'#ffe9a8'); }
    else if (p.type === 'z'){ rect(p.x,p.y,3,1,'#fff'); px(p.x+2,p.y+1,'#fff'); rect(p.x,p.y+2,3,1,'#fff'); }
    g.globalAlpha = 1;
  }
  for (let i = particles.length-1; i>=0; i--) if (particles[i].t >= particles[i].life) particles.splice(i,1);

  for (const b of bananas){ b.life -= dt; g.globalAlpha = Math.min(1,b.life);
    ell(b.x, b.y, 4, 2, '#f4cf3e'); px(b.x-3, b.y-1, '#8a6a1f'); g.globalAlpha = 1; }
  for (let i = bananas.length-1; i>=0; i--) if (bananas[i].life <= 0) bananas.splice(i,1);
}
function drawThumpFx(dt){
  for (const r of thumpRipples){ r.t += dt; const rad = r.t*70, a = Math.max(0,1-r.t/0.8);
    g.globalAlpha = a; ringOutline(r.x, r.y, rad, rad*0.35, '#e0603a'); g.globalAlpha = 1; }
  for (let i = thumpRipples.length-1; i>=0; i--) if (thumpRipples[i].t > 0.8) thumpRipples.splice(i,1);
}

/* dusk vignette */
function drawAmbient(){
  const edge = 1 - skyLight();
  if (edge > 0.45){ g.fillStyle = `rgba(30,22,58,${(edge-0.45)*0.4})`; g.fillRect(0,0,PW,PH); }
}

/* ===========================================================================
 *  8.  NIGHT ZOOMIES CUTSCENE
 * ======================================================================== */
function startNight(){ cutscene = {t:0, dur:5.5}; bigcap('🌙 3 A.M. ZOOMIES', `${cap(P().s)} runs laps all night long…`, true); }
function endNight(){
  cutscene = null; timeOfDay = 0.04;
  rab.day++; rab.bananasToday = 0;
  document.getElementById('dayLbl').textContent = 'Day ' + rab.day;
  stats.hunger = clamp(stats.hunger+55, 60, 100); stats.water = clamp(stats.water-18); stats.happy = clamp(stats.happy+22);
  rab.cold = false; rab.thumps = clamp(rab.thumps-1, 0, 5); rab.x = world.rug.x;
  startBinky();
  toast(`☀️ Good morning! Day ${rab.day} — ${rab.name} is STARVING but binkying to see you!`);
}
function drawNight(dt){
  cutscene.t += dt; const ct = cutscene.t;
  rect(0,0,PW,PH,'#0c1030');
  for (let i=0;i<50;i++){ const sx=(i*97)%PW, sy=(i*53)%world.floorY;
    g.globalAlpha = 0.3+0.7*(0.5+0.5*Math.sin(ct*3+i)); px(sx,sy,'#fff'); }
  g.globalAlpha = 1;
  ell(Math.round(PW*0.8), Math.round(PH*0.18), 8, 8, '#eef1ff'); ell(Math.round(PW*0.82), Math.round(PH*0.16), 7, 7, '#0c1030');
  rect(0, world.floorY, PW, PH-world.floorY, '#14173a');
  ell(world.rug.x, world.rug.y, world.rug.rx, world.rug.ry, 'rgba(60,70,140,.3)');
  const spd = 5.5;
  for (let k=5;k>=0;k--){ const tt = ct - k*0.05;
    const zx = world.rug.x + Math.round(world.rug.rx*0.9*Math.sin(tt*spd));
    const dir = Math.cos(tt*spd) >= 0 ? 1 : -1;
    const zy = world.rug.y - Math.abs(Math.sin(tt*spd*2))*Math.round(PH*0.12) - 2;
    drawMiniBunny(zx, zy, dir, k===0 ? 1 : 0.13*(6-k)); }
  if (Math.sin(ct*spd*2) > 0.9) stars(world.rug.x + Math.round(world.rug.rx*0.9*Math.sin(ct*spd)), world.rug.y-10);
  drawParticles(dt);
  if (ct >= cutscene.dur){ hideBigcap(); endNight(); }
}

/* ===========================================================================
 *  9.  ACTIONS
 * ======================================================================== */
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove('show'), 2600); }
const capEl = document.getElementById('bigcap');
function bigcap(main, sub, hold){ capEl.innerHTML = main + (sub?`<small>${sub}</small>`:'');
  capEl.classList.remove('pop','show'); void capEl.offsetWidth;
  capEl.classList.add(hold ? 'show' : 'pop'); }
function hideBigcap(){ capEl.classList.remove('show','pop'); }

function triggerThump(){ rab.legStomp = 1; thumpFx = 0.5; const p = parts();
  thumpRipples.push({x:p.cx, y:rab.baseY, t:0}); sparkle(p.feet.x, p.feet.y); bigcap('THUMP!', '', false); }
function startBinky(){ rab.binkyT = rab.binkyDur; const p = parts(); for (let i=0;i<5;i++) heart(p.head.x+rand(-8,8), p.head.y); }
function hopTo(x){ rab.hopToX = clamp(x, 16, PW-16); rab.hopFromX = rab.x; rab.hopT0 = now(); rab.hopping = true; rab.lookX = Math.sign(rab.hopToX-rab.x); }

function giveHay(){ if (rab.cold) return coldRefuse();
  stats.hunger = clamp(stats.hunger-40); stats.happy = clamp(stats.happy+4); rab.thumps = clamp(rab.thumps-0.4,0,5); hayFresh = 6;
  hopTo(world.litter.x + world.litter.w*0.2); toast(`Fresh Timothy hay in the box! ${rab.name} settles in to munch.`); }
function givePellets(){ if (rab.cold) return coldRefuse();
  stats.hunger = clamp(stats.hunger-24); stats.happy = clamp(stats.happy+6); hopTo(world.food.x); heart(parts().head.x, parts().head.y);
  toast(`A scoop of dry pellets. ${cap(P().s)} nose-dives into the bowl. 🥣`); }
function giveWater(){ stats.water = 100; rab.thumps = clamp(rab.thumps-0.2,0,5); drop(world.water.x, world.water.y-4); toast('Fresh, clean water. 💧'); }
function offerBanana(){
  const p = parts(); bananas.push({x:rab.x+rand(-4,4), y:rab.baseY-4, life:3});
  if (rab.cold){ rab.cold = false; rab.thumps = 0; stats.happy = clamp(stats.happy+20);
    for (let i=0;i<6;i++) heart(p.head.x+rand(-8,8), p.head.y); startBinky();
    toast(`The apology banana! ${cap(P().s)} turns back around… forgiven. 🍌`); return; }
  if (rab.bananasToday >= 2){ rab.tummyUntil = now()+5; rab.state = 'tummy';
    stats.happy = clamp(stats.happy-14); stats.hunger = clamp(stats.hunger+8); rab.thumps = clamp(rab.thumps+0.6,0,5);
    toast(`That's ${P().p} 3rd banana — tummy ache! 🤢 (max 2/day)`); return; }
  rab.bananasToday++; stats.happy = clamp(stats.happy+22); stats.hunger = clamp(stats.hunger-6); rab.thumps = clamp(rab.thumps-1,0,5); startBinky();
  toast(`Banana! A full-body binky of joy. (${rab.bananasToday}/2 today)`); }
function cleanLitter(){ stats.hygiene = 100; rab.thumps = clamp(rab.thumps-0.6,0,5); stats.happy = clamp(stats.happy+4);
  sparkle(world.litter.x, world.litter.y); toast('Litter box scooped & fresh. Hygiene restored. ✨'); }
function togglePetting(){ pettingMode = !pettingMode; document.getElementById('bPet').classList.toggle('armed', pettingMode);
  toast(pettingMode ? 'Petting ON — drag over the HEAD (never the feet!).' : 'Petting off.'); }
function doTrick(){ if (rab.cold) return coldRefuse();
  if (rab.trick || rab.binkyT > 0) return;
  if (stats.happy < 30){ toast(`${rab.name} isn't in the mood for tricks. Bond a little more first.`); return; }
  if (Math.random() < 0.15){ toast(`${rab.name} ignores you and grooms an ear. Rabbits. 🙄`); return; }
  const name = pick(['spin','flop','binky','binky']);
  const labels = {spin:'a happy spin 🌀', flop:'a dramatic flop 😌', binky:'a joyful binky ✨'};
  if (name === 'binky') startBinky(); else rab.trick = {name, t:0, dur:name==='flop'?1.8:1.0};
  stats.happy = clamp(stats.happy+8); const p = parts(); for (let i=0;i<4;i++) heart(p.head.x+rand(-8,8), p.head.y);
  toast(`${rab.name} does ${labels[name]}`); }
function coldRefuse(){ toast(`${cap(P().s)} has turned ${P().p} back. Only a banana will fix this. 🍌`); sparkle(parts().tail.x, parts().tail.y); }

function handlePet(px_, py_){
  if (!pettingMode || rab.cold || rab.state === 'tummy') return;
  const p = parts();
  const dHead = Math.hypot(px_-p.head.x, py_-p.head.y);
  const dFeet = Math.hypot(px_-p.feet.x, py_-p.feet.y);
  const dTail = Math.hypot(px_-p.tail.x, py_-p.tail.y);
  const tnow = now();
  if ((dFeet < p.feet.r && py_ > p.head.y + p.head.r*0.7) || dTail < p.tail.r*1.4){
    if (tnow - lastFeetPet > 0.8){ lastFeetPet = tnow;
      rab.thumps = clamp(rab.thumps+1.4,0,5); stats.happy = clamp(stats.happy-8);
      triggerThump(); toast('You touched the SACRED back feet! 😾 *THUMP*'); checkThreshold(); }
    return;
  }
  if (dHead < p.head.r*1.3){ if (tnow - lastPetGain > 0.12){ lastPetGain = tnow;
    stats.happy = clamp(stats.happy+2.2); rab.thumps = clamp(rab.thumps-0.15,0,5);
    if (Math.random() < 0.5) heart(px_+rand(-3,3), py_-3); } }
}
function checkThreshold(){
  if (rab.thumps >= 3 && !wasAbove3){ wasAbove3 = true; triggerThump(); }
  if (rab.thumps < 2.6) wasAbove3 = false;
  if (rab.thumps >= 5) rab.cold = true;
}

/* ===========================================================================
 *  10.  IDLE BRAIN + STATE MACHINE
 * ======================================================================== */
let nextIdle = 3;
function idleBrain(dt, t){
  if (rab.cold || rab.state === 'tummy' || rab.hopping || rab.trick || rab.binkyT > 0) return;
  if (pettingMode && pointer.down) return;
  if (stats.happy > 88 && Math.random() < 0.004){ startBinky(); return; }
  nextIdle -= dt;
  if (nextIdle <= 0){ nextIdle = rand(3.5, 7); const roll = Math.random();
    if      (roll < 0.4)  hopTo(rand(world.rug.x-world.rug.rx*0.55, world.rug.x+world.rug.rx*0.55));
    else if (roll < 0.62) rab.groomUntil = t + rand(1.4, 2.6);
    else if (roll < 0.74 && stats.happy > 75) startBinky();
    else if (roll < 0.86) hopTo(world.bed.x); }
}
function updateState(t){
  if (rab.cold){ rab.state = 'cold'; return; }
  if (t < rab.tummyUntil){ rab.state = 'tummy'; return; }
  if (rab.trick){ rab.state = 'trick'; return; }
  if (rab.legStomp > 0.05){ rab.state = 'thump'; return; }
  const p = parts();
  const near = Math.hypot(pointer.x-p.head.x, pointer.y-p.head.y) < p.head.r*3 && pointer.moved > 0;
  const needy = stats.hunger > 62 || stats.hygiene < 32 || stats.water < 28 || rab.thumps >= 2;
  if (rab.hopping || rab.binkyT > 0 || near || needy){ rab.state = 'alert';
    rab.lookX = clamp((pointer.x-p.head.x)/40, -1, 1); rab.lookY = clamp((pointer.y-p.head.y)/40, -1, 1); return; }
  rab.state = 'loaf';
}

/* ===========================================================================
 *  11.  MAIN LOOP
 * ======================================================================== */
let last = now();
function frame(){
  const t = now(); let dt = t - last; last = t; dt = Math.min(dt, 0.05);

  if (cutscene){ drawNight(dt); blit(); requestAnimationFrame(frame); return; }

  // Day clock — the sun arcs and sets; dusk triggers the night zoomies.
  timeOfDay += dt/DAY_LEN;
  if (timeOfDay >= 1){ timeOfDay = 1; startNight(); requestAnimationFrame(frame); return; }
  document.getElementById('clockLbl').textContent =
    timeOfDay<0.15?'🌅': timeOfDay<0.45?'☀️': timeOfDay<0.75?'🌤️': timeOfDay<0.9?'🌇':'🌆';

  // Stat decay
  stats.hunger  = clamp(stats.hunger  + 1.4*dt);
  stats.hygiene = clamp(stats.hygiene - 1.1*dt);
  stats.water   = clamp(stats.water   - 1.0*dt);
  stats.happy   = clamp(stats.happy   - 0.85*dt);
  if (hayFresh > 0) hayFresh -= dt;

  let pressure = 0;
  if (stats.hunger > 70) pressure++;
  if (stats.hygiene < 30) pressure++;
  if (stats.water < 25) pressure++;
  if (stats.happy < 25) pressure++;
  if (pressure > 0) rab.thumps = clamp(rab.thumps + pressure*0.15*dt, 0, 5);
  else if (!rab.cold) rab.thumps = clamp(rab.thumps - 0.12*dt, 0, 5);
  checkThreshold();

  // Animation timers
  rab.breath += dt*2.2;
  rab.noseTwitch += dt*(rab.state === 'alert' ? 12 : 4);
  if (rab.legStomp > 0) rab.legStomp = Math.max(0, rab.legStomp - dt*2.4);
  if (thumpFx > 0) thumpFx = Math.max(0, thumpFx - dt);
  if (rab.binkyT > 0){ rab.binkyT = Math.max(0, rab.binkyT-dt); const pr = 1-rab.binkyT/rab.binkyDur; rab.binkyHop = -Math.sin(pr*Math.PI)*22; }
  else rab.binkyHop = 0;
  if (rab.trick){ rab.trick.t += dt; if (rab.trick.t >= rab.trick.dur) rab.trick = null; }
  rab.nextBlink -= dt; if (rab.nextBlink <= 0){ rab.blink = 0.13; rab.nextBlink = rand(2.5,6); }
  if (rab.blink > 0) rab.blink -= dt;

  if (rab.hopping){ const k = (t-rab.hopT0)/rab.hopDur;
    if (k >= 1){ rab.hopping = false; rab.hopOff = 0; rab.x = rab.hopToX; }
    else { rab.x = lerp(rab.hopFromX, rab.hopToX, k); rab.hopOff = -Math.sin(k*Math.PI)*14; } }

  idleBrain(dt, t);
  updateState(t);

  // "The Loaf" — content + fed + calm → tuck into a soft oval, feet hidden.
  const wantsLoaf = rab.state === 'loaf' && !rab.hopping && stats.happy > 60 && stats.hunger < 52;
  rab.loaf = damp(rab.loaf, wantsLoaf ? 1 : 0, 3.2, dt);
  if (rab.state === 'loaf' && stats.happy > 70 && Math.random() < 0.006){ const p = parts(); zzz(p.head.x+6, p.head.y-r0(p)); }

  // ---- Render the pixel scene ----
  g.save();
  if (thumpFx > 0){ const m = Math.round(thumpFx*3); g.translate(Math.round(rand(-m,m)), Math.round(rand(-m,m))); }
  drawRoom();
  drawParticles(dt);
  drawRabbit(t);
  drawThumpFx(dt);
  drawAmbient();
  g.restore();

  blit();
  updateHUD();
  requestAnimationFrame(frame);
}
function r0(p){ return p.head.r; }

// Scale the low-res buffer up to the display with no smoothing → crisp pixels.
function blit(){ dctx.imageSmoothingEnabled = false; dctx.clearRect(0,0,disp.width,disp.height);
  dctx.drawImage(buf, 0, 0, PW, PH, 0, 0, disp.width, disp.height); }

/* ===========================================================================
 *  12.  HUD
 * ======================================================================== */
const PAW_SVG = c => `<svg class="paw" viewBox="0 0 24 24" shape-rendering="crispEdges"><path fill="${c}" d="M12 14c-3 0-5 2-5 4 0 1.5 1.5 2 3 2 1 0 1.5-.5 2-.5s1 .5 2 .5c1.5 0 3-.5 3-2 0-2-2-4-5-4zM6.5 12.5c1 0 1.7-1.2 1.5-2.6C7.8 8.5 6.9 7.7 6 7.8c-1 .1-1.6 1.3-1.4 2.7.2 1.2 1 2 1.9 2zM17.5 12.5c.9 0 1.7-.8 1.9-2 .2-1.4-.4-2.6-1.4-2.7-.9-.1-1.8.7-2 2.1-.2 1.4.5 2.6 1.5 2.6zM9.5 8.3c.9-.2 1.4-1.4 1.1-2.7C10.3 4.3 9.4 3.6 8.5 3.8c-.9.2-1.4 1.4-1.1 2.7.3 1.3 1.2 2 2.1 1.8zM14.5 8.3c.9.2 1.8-.5 2.1-1.8.3-1.3-.2-2.5-1.1-2.7-.9-.2-1.8.5-2.1 1.8-.3 1.3.2 2.5 1.1 2.7z"/></svg>`;
function initPaws(){ const wrap = document.getElementById('paws'); wrap.innerHTML = '';
  for (let i=0;i<5;i++){ const d = document.createElement('span'); d.innerHTML = PAW_SVG('#e0603a'); wrap.appendChild(d.firstChild); } }
function updateHUD(){
  const set = (id, v, invert) => { const el = document.getElementById(id); el.style.width = v+'%';
    const q = invert ? (100-v) : v;
    el.style.background = q>55 ? '#7bc46c' : q>28 ? '#e6bd3c' : '#e0603a'; };
  set('fHappy', Math.round(stats.happy), false); set('fHunger', Math.round(stats.hunger), true);
  set('fWater', Math.round(stats.water), false); set('fHygiene', Math.round(stats.hygiene), false);
  const paws = document.querySelectorAll('.paw'), n = Math.round(rab.thumps);
  paws.forEach((pw,i)=>pw.classList.toggle('on', i<n));
}

/* ===========================================================================
 *  13.  INPUT  (client → design-pixel coordinates)
 * ======================================================================== */
function toDesign(e){ const r = disp.getBoundingClientRect();
  const cx = (e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX) - r.left;
  const cy = (e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY) - r.top;
  return { x: cx * PW / r.width, y: cy * PH / r.height }; }
function onDown(e){ pointer.down = true; const p = toDesign(e); pointer.x = p.x; pointer.y = p.y; pointer.moved = 1; handlePet(p.x, p.y); }
function onMove(e){ const p = toDesign(e); pointer.x = p.x; pointer.y = p.y; pointer.moved = 1; if (pointer.down) handlePet(p.x, p.y); }
function onUp(){ pointer.down = false; }
disp.addEventListener('mousedown', onDown);
disp.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
disp.addEventListener('touchstart', e => { e.preventDefault(); onDown(e); }, {passive:false});
disp.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e); }, {passive:false});
window.addEventListener('touchend', onUp);

document.getElementById('bHay').addEventListener('click', giveHay);
document.getElementById('bPellets').addEventListener('click', givePellets);
document.getElementById('bWater').addEventListener('click', giveWater);
document.getElementById('bBanana').addEventListener('click', offerBanana);
document.getElementById('bPet').addEventListener('click', togglePetting);
document.getElementById('bTrick').addEventListener('click', doTrick);
document.getElementById('bClean').addEventListener('click', cleanLitter);

/* ===========================================================================
 *  14.  ADOPTION SCREEN → START
 * ======================================================================== */
let chosenCoat = 'sableGrey', chosenSex = 'doe';
function buildStart(){
  const sw = document.getElementById('swatches');
  Object.keys(COATS).forEach(key => {
    const co = COATS[key];
    const d = document.createElement('div');
    d.className = 'swatch' + (key === 'sableGrey' ? ' on' : '');
    d.style.background = co.body; d.style.boxShadow = `2px 2px 0 rgba(0,0,0,.5), inset -10px -10px 0 ${co.shade}, inset 8px 8px 0 ${co.hi}, inset 0 0 0 3px ${co.point}`;
    d.title = co.name; d.dataset.key = key;
    d.addEventListener('click', () => { chosenCoat = key;
      document.querySelectorAll('.swatch').forEach(x => x.classList.remove('on')); d.classList.add('on');
      document.getElementById('coatName').textContent = co.name; coat = co; });
    sw.appendChild(d);
  });
  document.querySelectorAll('#sexSeg button').forEach(b => b.addEventListener('click', () => { chosenSex = b.dataset.sex;
    document.querySelectorAll('#sexSeg button').forEach(x => x.classList.remove('on')); b.classList.add('on'); }));
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });
}
function startGame(){
  if (started) return; started = true;
  coat = COATS[chosenCoat] || COATS.sableGrey; rab.sex = chosenSex;
  const nm = (document.getElementById('nameInput').value || '').trim();
  rab.name = nm || pick(['Mowgli','Nutmeg','Clover','Waffles','Mochi','Pip','Biscuit','Bramble']);
  document.getElementById('petName').textContent = rab.name.toUpperCase();
  document.getElementById('start').classList.add('hidden');
  initPaws(); resize();
  rab.x = world.rug.x; rab.baseY = world.rug.y - 2;
  startBinky();
  toast(`Welcome home, ${rab.name}! ${cap(P().s)} does a happy binky. 🐰`);
  last = now(); requestAnimationFrame(frame);
}

/* ---------------- Boot ---------------- */
buildStart();
resize();   // size the buffer + display behind the adoption overlay

})();
</script>
