# Runs the test suite on every push to main.
# The site itself is published by GitHub Pages straight from main (Settings → Pages → Source: branch
# "main", root), so this check reports failures but does not block publishing.
# (The tester build at /beta/ is retired for now. To gate publishing on the tests, switch Pages'
# source to "GitHub Actions" and add upload-pages-artifact / deploy-pages steps back.)
name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the test suite
        run: CHROME="$(command -v google-chrome)" python3 tests/run_tests.py
